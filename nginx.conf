events { worker_connections 1024; }

http {
    server {
        listen 8080;

        location / {
            # Security: Require a secret key in query string (e.g. ?token=mySecret123)
            # to prevent unauthorized public abuse.
            if ($arg_token != "CHANGE_THIS_SECRET_KEY") {
                return 403 "Forbidden";
            }

            proxy_pass http://btdigggink2pdqzqrik3blmqemsbntpzwxottujilcdjfz56jumzfsyd.onion;
            proxy_set_header Host btdigggink2pdqzqrik3blmqemsbntpzwxottujilcdjfz56jumzfsyd.onion;
            
            # Route through local Tor SOCKS proxy
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
    }
}
