events { worker_connections 1024; }

http {
    server {
        listen 8080;

        # Lightweight keep-alive endpoint (answers in <1ms without hitting Tor)
        location = /ping {
            default_type text/plain;
            return 200 "pong\n";
        }

        # Tor reverse proxy
        location / {
            proxy_pass http://127.0.0.1:8118;
            proxy_http_version 1.1;
            proxy_set_header Host btdigggink2pdqzqrik3blmqemsbntpzwxottujilcdjfz56jumzfsyd.onion;
            proxy_set_header Connection "";

            proxy_connect_timeout 45s;
            proxy_read_timeout 90s;
        }
    }
}
